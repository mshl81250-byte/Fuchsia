name: Android client and business APKs

on:
  push:
    branches: [fix/android-client-issues]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  server-security:
    name: Test API authentication safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install API workspace dependencies
        run: pnpm install --filter @workspace/api-server... --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Test authentication safeguards
        run: pnpm --filter @workspace/api-server run test:auth-security

  build-apk:
    name: Build low-size ARM release APKs (client and business)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Use hosted SDK-compatible versions
        run: |
          find apps -path '*/android/*.gradle.kts' -exec sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/g' \
            -e 's/2026.09.00/2025.08.01/g' \
            -e 's/1.13.0/1.10.1/g' \
            -e 's/2.10.2/2.9.3/g' \
            -e 's/2.11.0/2.9.2/g' {} +

      - name: Build client low-size release APKs
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build business low-size release APKs
        working-directory: apps/partner/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Collect release APKs and report file sizes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fuchsia-apks/client" "$RUNNER_TEMP/fuchsia-apks/business"
          cp apps/mobile/android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/fuchsia-apks/client/"
          cp apps/partner/android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/fuchsia-apks/business/"
          find "$RUNNER_TEMP/fuchsia-apks" -type f -name '*.apk' -print -exec du -h {} \; -exec sha256sum {} \;

      - name: Upload low-size client and business ARM APKs
        uses: actions/upload-artifact@v4
        with:
          name: fuchsia-client-business-release-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/fuchsia-apks/client/*.apk
            ${{ runner.temp }}/fuchsia-apks/business/*.apk

  android-smoke:
    name: Test client API, client UI and business app on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and emulator image
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools emulator system-images;android-36;google_apis;x86_64'

      - name: Use hosted SDK-compatible emulator build versions
        run: |
          find apps -path '*/android/*.gradle.kts' -exec sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/g' \
            -e 's/2026.09.00/2025.08.01/g' \
            -e 's/1.13.0/1.10.1/g' \
            -e 's/2.10.2/2.9.3/g' \
            -e 's/2.11.0/2.9.2/g' {} +
          sed -i 's/include("arm64-v8a", "armeabi-v7a")/include("x86_64")/' \
            apps/mobile/android/app/build.gradle.kts
          sed -i 's/include("arm64-v8a", "armeabi-v7a")/include("x86_64")/' \
            apps/partner/android/app/build.gradle.kts

      - name: Create and boot Android emulator with bounded waits
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if [ ! -e /dev/kvm ]; then echo 'KVM device is unavailable on this runner.' >&2; exit 1; fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          printf 'no\n' | timeout 120s "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" \
            create avd --force --name fuchsia-api-smoke --device pixel_2 \
            --package 'system-images;android-36;google_apis;x86_64' \
            --path "$ANDROID_AVD_HOME/fuchsia-api-smoke.avd"
          if [ ! -f "$ANDROID_AVD_HOME/fuchsia-api-smoke.ini" ]; then
            find "$HOME/.android" -maxdepth 4 -name '*.ini' -print || true
            echo 'AVD manager did not create the expected AVD metadata file.' >&2
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -avd fuchsia-api-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel auto \
            > "$RUNNER_TEMP/fuchsia-emulator.log" 2>&1 &
          emulator_pid=$!
          adb_path="$ANDROID_HOME/platform-tools/adb"
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/fuchsia-emulator.log"
              echo 'Android emulator process exited before boot.' >&2
              exit 1
            fi
            device_state=$(timeout 10s "$adb_path" get-state 2>/dev/null || true)
            if [ "$device_state" = 'device' ]; then
              boot_state=$(timeout 10s "$adb_path" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$boot_state" = '1' ]; then
                booted=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$booted" != true ]; then
            cat "$RUNNER_TEMP/fuchsia-emulator.log"
            echo 'Android emulator did not finish booting within five minutes.' >&2
            exit 1
          fi
          "$adb_path" shell settings put global window_animation_scale 0
          "$adb_path" shell settings put global transition_animation_scale 0
          "$adb_path" shell settings put global animator_duration_scale 0

      - name: Test configured API from Android emulator
        working-directory: apps/mobile/android
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Build business app for Android emulator
        working-directory: apps/partner/android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Launch app and capture initial screen
        run: |
          set -euo pipefail
          adb_path="$ANDROID_HOME/platform-tools/adb"
          client_apk=$(find apps/mobile/android/app/build/outputs/apk/debug -maxdepth 1 -name '*x86_64*debug.apk' -print -quit)
          if [ -z "$client_apk" ]; then
            find apps/mobile/android/app/build/outputs/apk/debug -maxdepth 1 -type f -print || true
            echo 'Client x86_64 debug APK was not generated.' >&2
            exit 1
          fi
          "$adb_path" install -r "$client_apk"
          activity_ready=false
          for attempt in $(seq 1 60); do
            activity_service=$("$adb_path" shell service check activity 2>&1 | tr -d '\r' || true)
            if [[ "$activity_service" == *found* ]]; then
              activity_ready=true
              break
            fi
            sleep 2
          done
          if [ "$activity_ready" != true ]; then
            "$adb_path" logcat -d -s SystemServer:E AndroidRuntime:E
            echo 'Android activity service did not remain available.' >&2
            exit 1
          fi
          "$adb_path" shell am start -W -n com.fuchsia.platform.debug/com.fuchsia.platform.compose.MainActivity
          sleep 5
          app_pid=$("$adb_path" shell pidof com.fuchsia.platform.debug | tr -d '\r' || true)
          if [ -z "$app_pid" ]; then
            "$adb_path" logcat -d -s AndroidRuntime:E
            echo 'Fuchsia Android app did not remain running after launch.' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fuchsia-ui"
          "$adb_path" exec-out screencap -p > "$RUNNER_TEMP/fuchsia-ui/android-initial-screen.png"
          test -s "$RUNNER_TEMP/fuchsia-ui/android-initial-screen.png"

      - name: Install, launch and capture business app
        run: |
          set -euo pipefail
          adb_path="$ANDROID_HOME/platform-tools/adb"
          "$adb_path" install -r apps/partner/android/app/build/outputs/apk/debug/app-x86_64-debug.apk
          "$adb_path" shell am start -W -n com.fuchsia.partner/com.fuchsia.partner.MainActivity
          sleep 5
          app_pid=$("$adb_path" shell pidof com.fuchsia.partner | tr -d '\r' || true)
          if [ -z "$app_pid" ]; then
            "$adb_path" logcat -d -s AndroidRuntime:E
            echo 'Fuchsia business app did not remain running after launch.' >&2
            exit 1
          fi
          "$adb_path" exec-out screencap -p > "$RUNNER_TEMP/fuchsia-ui/android-business-initial-screen.png"
          test -s "$RUNNER_TEMP/fuchsia-ui/android-business-initial-screen.png"

      - name: Upload Android emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuchsia-android-ui-smoke
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/fuchsia-ui/*.png
