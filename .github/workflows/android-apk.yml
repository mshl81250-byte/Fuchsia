name: Android client APK

on:
  push:
    branches: [fix/android-client-issues]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    name: Android API smoke test and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools emulator system-images;android-36;google_apis;x86_64'

      - name: Use hosted SDK-compatible versions
        run: |
          find apps -path '*/android/*.gradle.kts' -exec sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/g' \
            -e 's/2026.09.00/2025.08.01/g' \
            -e 's/1.13.0/1.10.1/g' \
            -e 's/2.10.2/2.9.3/g' \
            -e 's/2.11.0/2.9.2/g' {} +
          sed -i 's/include("arm64-v8a", "armeabi-v7a")/include("x86_64")/' \
            apps/mobile/android/app/build.gradle.kts

      - name: Create Android emulator
        run: |
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name fuchsia-api-smoke \
            --device pixel_2 \
            --package 'system-images;android-36;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd fuchsia-api-smoke \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel auto \
            > "$RUNNER_TEMP/fuchsia-emulator.log" 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 60); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
              "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/fuchsia-emulator.log"
          echo 'Android emulator did not finish booting.' >&2
          exit 1

      - name: Test client API connection on Android emulator
        working-directory: apps/mobile/android
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon

      - name: Build ARM debug APKs
        working-directory: apps/mobile/android
        run: |
          sed -i 's/include("x86_64")/include("arm64-v8a", "armeabi-v7a")/' app/build.gradle.kts
          rm -rf app/build/outputs/apk/debug
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fuchsia-android-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
