version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    versioning-strategy: increase

  - package-ecosystem: npm
    directory: "/apps/mobile"
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mobile
    versioning-strategy: increase

  - package-ecosystem: npm
    directory: "/artifacts/api-server"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    versioning-strategy: increase
